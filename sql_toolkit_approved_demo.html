<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>SQL Agent Live Dashboard</title>
  <style>
    :root {
      --bg:#f5f7fb; --panel:#fff; --text:#111827; --muted:#64748b; --border:#e2e8f0;
      --blue:#2563eb; --green:#059669; --red:#dc2626; --amber:#d97706; --shadow:0 8px 30px rgba(15,23,42,.06);
    }
    body.dark { --bg:#0f172a; --panel:#172033; --text:#f8fafc; --muted:#94a3b8; --border:#334155; --shadow:0 10px 35px rgba(0,0,0,.22); }
    * { box-sizing:border-box; }
    body { margin:0; padding:26px; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
    button,input,select { font:inherit; }
    .container { max-width:1450px; margin:auto; }
    .topbar { display:flex; gap:16px; justify-content:space-between; align-items:flex-start; margin-bottom:18px; flex-wrap:wrap; }
    h1 { margin:0 0 5px; font-size:26px; }
    .subtitle { color:var(--muted); font-size:13px; }
    .actions { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
    .btn { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:10px; padding:9px 13px; cursor:pointer; }
    .btn:hover { border-color:#94a3b8; }
    .btn.primary { background:var(--blue); color:white; border-color:var(--blue); font-weight:650; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .refresh-state { display:flex; align-items:center; gap:8px; padding:9px 13px; border:1px solid var(--border); background:var(--panel); border-radius:10px; font-size:13px; color:var(--muted); }
    .dot-live { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(5,150,105,.12); }
    .dot-live.loading { background:var(--amber); box-shadow:0 0 0 4px rgba(217,119,6,.12); }
    .dot-live.error { background:var(--red); box-shadow:0 0 0 4px rgba(220,38,38,.12); }
    .error-banner { display:none; margin-bottom:16px; padding:12px 15px; border:1px solid #fecaca; background:#fef2f2; color:#991b1b; border-radius:12px; font-size:13px; }
    body.dark .error-banner { background:#450a0a; color:#fecaca; border-color:#7f1d1d; }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(180px,1fr)); gap:14px; margin-bottom:16px; }
    .sum-card { background:var(--panel); border:1px solid var(--border); border-right:5px solid #cbd5e1; border-radius:15px; padding:18px; cursor:pointer; box-shadow:var(--shadow); transition:.18s; }
    .sum-card:hover { transform:translateY(-2px); }
    .sum-card.active { box-shadow:0 0 0 2px var(--blue) inset,var(--shadow); }
    .sum-card.failed { border-right-color:var(--red); }
    .sum-card.running { border-right-color:var(--amber); }
    .sum-card.all { border-right-color:var(--blue); }
    .sum-title { font-size:13px; font-weight:650; color:var(--muted); }
    .sum-num { font-size:31px; font-weight:750; margin:5px 0 2px; }
    .sum-sub { font-size:12px; color:var(--muted); }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--panel); border:1px solid var(--border); padding:12px; border-radius:14px; margin-bottom:16px; }
    .search { flex:1; min-width:240px; }
    .search input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--panel); color:var(--text); outline:none; }
    .search input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    .toolbar-meta { color:var(--muted); font-size:13px; }
    .auto { display:flex; gap:7px; align-items:center; font-size:13px; color:var(--muted); }
    .auto select { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:8px; padding:6px 8px; }
    .jobs { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:15px; }
    .job { background:var(--panel); border:1px solid var(--border); border-right:6px solid #cbd5e1; border-radius:15px; padding:18px; box-shadow:var(--shadow); min-height:220px; display:flex; flex-direction:column; }
    .job.failed-today { border-right-color:var(--red); }
    .job.running { border-right-color:var(--amber); }
    .job.succeeded:not(.failed-today) { border-right-color:var(--green); }
    .job-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .job-name { font-size:17px; font-weight:750; word-break:break-word; }
    .badge { padding:4px 9px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; background:#f1f5f9; color:#475569; }
    .badge.failed { background:#fee2e2; color:#991b1b; }
    .badge.running { background:#fef3c7; color:#92400e; }
    .badge.success { background:#d1fae5; color:#065f46; }
    body.dark .badge { background:#334155; color:#cbd5e1; }
    body.dark .badge.failed { background:#450a0a; color:#fecaca; }
    body.dark .badge.running { background:#451a03; color:#fde68a; }
    body.dark .badge.success { background:#022c22; color:#a7f3d0; }
    .details { display:flex; flex-direction:column; gap:7px; margin-top:14px; color:var(--muted); font-size:13px; }
    .details b { color:var(--text); font-weight:650; }
    .failure-box { margin-top:11px; padding:10px 11px; background:#fff7f7; border:1px solid #fecaca; border-radius:10px; color:#991b1b; font-size:12px; }
    body.dark .failure-box { background:#300b0b; border-color:#7f1d1d; color:#fecaca; }
    .recovered { margin-top:7px; color:var(--green); font-weight:650; }
    .history { display:flex; gap:5px; margin-top:8px; direction:rtl; }
    .h { width:9px; height:9px; border-radius:50%; background:#cbd5e1; }
    .h.S { background:var(--green); } .h.F { background:var(--red); } .h.R { background:var(--amber); } .h.C { background:#94a3b8; }
    details { margin-top:8px; }
    details summary { cursor:pointer; font-weight:650; }
    .error-text { margin-top:7px; padding:8px; border-radius:8px; background:rgba(220,38,38,.08); white-space:pre-wrap; word-break:break-word; }
    .empty { grid-column:1/-1; text-align:center; padding:55px 20px; background:var(--panel); border:1px dashed var(--border); border-radius:15px; color:var(--muted); }
    .loading-shell { grid-column:1/-1; text-align:center; padding:55px; color:var(--muted); }
    @media(max-width:760px){ body{padding:12px}.summary{grid-template-columns:1fr}.jobs{grid-template-columns:1fr}h1{font-size:21px}.actions{width:100%}.refresh-state{flex:1} }
  </style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div>
      <h1>SQL Agent Live Dashboard</h1>
      <div class="subtitle">הנתונים נשלפים ישירות מ־msdb בכל פתיחה או רענון של הדף</div>
    </div>
    <div class="actions">
      <div class="refresh-state" id="refreshState">
        <span class="dot-live loading" id="liveDot"></span>
        <span id="updatedLabel">טוען נתונים...</span>
      </div>
      <button class="btn primary" id="refreshBtn" onclick="refreshJobs(true)">↻ רענן עכשיו</button>
      <button class="btn" onclick="toggleTheme()">◐ מצב כהה/בהיר</button>
    </div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="summary">
    <div class="sum-card failed active" id="sumFailed" onclick="setFilter('failedToday')">
      <div class="sum-title">🚨 Jobs שנכשלו היום</div>
      <div class="sum-num" id="failedTodayJobs">–</div>
      <div class="sum-sub" id="failedEventsToday">טוען...</div>
    </div>
    <div class="sum-card running" id="sumRunning" onclick="setFilter('running')">
      <div class="sum-title">▶ רצים עכשיו</div>
      <div class="sum-num" id="runningCount">–</div>
      <div class="sum-sub">ריצות פעילות כרגע</div>
    </div>
    <div class="sum-card all" id="sumAll" onclick="setFilter('all')">
      <div class="sum-title">כל ה־Jobs</div>
      <div class="sum-num" id="totalJobs">–</div>
      <div class="sum-sub" id="successCount">טוען...</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search"><input id="searchBox" type="text" placeholder="חפש Job..." oninput="renderJobs()" /></div>
    <div class="toolbar-meta" id="visibleCount"></div>
    <label class="auto"><input type="checkbox" id="autoRefresh" checked onchange="configureAutoRefresh()" /> רענון אוטומטי</label>
    <div class="auto">כל
      <select id="refreshSeconds" onchange="configureAutoRefresh()">
        <option value="30">30 שניות</option>
        <option value="60" selected>60 שניות</option>
        <option value="120">2 דקות</option>
      </select>
      <span id="countdown"></span>
    </div>
  </div>

  <div class="jobs" id="jobsContainer"><div class="loading-shell">טוען את הסטטוס העדכני מ־SQL Server...</div></div>
</div>

<script>
  let allJobs = [];
  let currentFilter = 'failedToday';
  let refreshTimer = null;
  let countdownTimer = null;
  let nextRefreshAt = null;
  let isRefreshing = false;
  const THEME_KEY = 'jobDashboardLiveTheme_v1';

  function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem(THEME_KEY, document.body.classList.contains('dark') ? 'dark' : 'light');
  }

  (function initTheme(){
    if (localStorage.getItem(THEME_KEY) === 'dark') document.body.classList.add('dark');
  })();

  function setState(type, text) {
    const dot = document.getElementById('liveDot');
    dot.className = 'dot-live' + (type ? ' ' + type : '');
    document.getElementById('updatedLabel').textContent = text;
  }

  function showError(message) {
    const el = document.getElementById('errorBanner');
    el.textContent = message;
    el.style.display = 'block';
  }

  function clearError() {
    document.getElementById('errorBanner').style.display = 'none';
  }

  async function refreshJobs(manual) {
    if (isRefreshing) return;
    isRefreshing = true;
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    setState('loading', 'מעדכן עכשיו...');

    try {
      const response = await fetch('jobs.ashx?_=' + Date.now(), { cache: 'no-store', headers: { 'Accept': 'application/json' } });
      let data;
      try { data = await response.json(); }
      catch (_) { throw new Error('השרת לא החזיר JSON תקין.'); }

      if (!response.ok || !data.ok) {
        throw new Error((data && (data.error || data.details)) || ('HTTP ' + response.status));
      }

      allJobs = Array.isArray(data.jobs) ? data.jobs : [];
      clearError();
      updateSummary(data.summary || {});

      // בפעם הראשונה: אם אין תקלות היום, אל תשאיר מסך ריק — עבור לכל ה-Jobs.
      if (currentFilter === 'failedToday' && Number((data.summary || {}).failedTodayJobs || 0) === 0 && !window.__initialFilterResolved) {
        currentFilter = 'all';
      }
      window.__initialFilterResolved = true;

      renderJobs();
      setState('', 'עודכן: ' + data.updatedAt + ' · ' + data.queryDurationMs + 'ms');
      scheduleNextRefresh();
    } catch (err) {
      setState('error', 'העדכון נכשל — מוצגים הנתונים האחרונים');
      showError('שגיאת עדכון: ' + err.message);
      scheduleNextRefresh();
    } finally {
      isRefreshing = false;
      btn.disabled = false;
    }
  }

  function updateSummary(s) {
    document.getElementById('failedTodayJobs').textContent = s.failedTodayJobs ?? 0;
    document.getElementById('failedEventsToday').textContent = (s.failedEventsToday ?? 0) + ' אירועי כשל היום';
    document.getElementById('runningCount').textContent = s.runningCount ?? 0;
    document.getElementById('totalJobs').textContent = s.totalJobs ?? 0;
    document.getElementById('successCount').textContent = (s.succeededCount ?? 0) + ' עם סטטוס אחרון תקין';
  }

  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.sum-card').forEach(x => x.classList.remove('active'));
    if (filter === 'failedToday') document.getElementById('sumFailed').classList.add('active');
    if (filter === 'running') document.getElementById('sumRunning').classList.add('active');
    if (filter === 'all') document.getElementById('sumAll').classList.add('active');
    renderJobs();
  }

  function parseIso(s) {
    if (!s) return 0;
    const t = new Date(s).getTime();
    return isNaN(t) ? 0 : t;
  }

  function renderJobs() {
    const search = document.getElementById('searchBox').value.trim().toLowerCase();
    let jobs = allJobs.filter(j => {
      if (search && !String(j.jobName || '').toLowerCase().includes(search)) return false;
      if (currentFilter === 'failedToday') return Number(j.failuresToday || 0) > 0;
      if (currentFilter === 'running') return j.lastStatus === 'Running';
      return true;
    });

    jobs.sort((a,b) => {
      const af = Number(a.failuresToday || 0) > 0 ? 1 : 0;
      const bf = Number(b.failuresToday || 0) > 0 ? 1 : 0;
      if (af !== bf) return bf - af;
      const ar = a.lastStatus === 'Running' ? 1 : 0;
      const br = b.lastStatus === 'Running' ? 1 : 0;
      if (ar !== br) return br - ar;
      return parseIso(b.lastRunTimeIso) - parseIso(a.lastRunTimeIso) || String(a.jobName).localeCompare(String(b.jobName));
    });

    const container = document.getElementById('jobsContainer');
    document.getElementById('visibleCount').textContent = 'מוצגים ' + jobs.length + ' מתוך ' + allJobs.length;

    if (jobs.length === 0) {
      container.innerHTML = '<div class="empty">' +
        (currentFilter === 'failedToday' ? '✅ אין Jobs שנכשלו היום לפי הנתונים האחרונים.' : 'לא נמצאו Jobs שמתאימים לסינון.') +
        '</div>';
      return;
    }

    container.innerHTML = jobs.map(renderJobCard).join('');
  }

  function renderJobCard(j) {
    const failedToday = Number(j.failuresToday || 0) > 0;
    const running = j.lastStatus === 'Running';
    let css = 'job ' + (failedToday ? 'failed-today ' : '') + (running ? 'running' : (j.lastStatus === 'Succeeded' ? 'succeeded' : ''));

    let badgeClass = 'badge';
    let badgeText = statusText(j.lastStatus);
    if (running) badgeClass += ' running';
    else if (j.lastStatus === 'Failed') badgeClass += ' failed';
    else if (j.lastStatus === 'Succeeded') badgeClass += ' success';

    let failureHtml = '';
    if (failedToday) {
      const recovered = j.lastStatus === 'Succeeded'
        ? '<div class="recovered">✓ הריצה האחרונה הצליחה — הכשל של היום נשמר כאן למעקב</div>' : '';
      const msg = j.lastFailureMessage || j.lastFailureSummaryMessage || 'לא התקבלה הודעת שגיאה מפורטת.';
      failureHtml = '<div class="failure-box">' +
        '<div><b>🚨 נכשל היום:</b> ' + escapeHtml(String(j.failuresToday)) + ' פעמים</div>' +
        (j.lastFailureTime ? '<div><b>כשל אחרון:</b> ' + escapeHtml(j.lastFailureTime) + '</div>' : '') +
        (j.lastFailureStepName ? '<div><b>Step:</b> ' + escapeHtml(j.lastFailureStepName) + '</div>' : '') +
        recovered +
        '<details><summary>פרטי שגיאה</summary><div class="error-text">' + escapeHtml(msg) + '</div></details>' +
        '</div>';
    }

    let etaHtml = '';
    if (running && j.currentRunStartIso && j.avgDurationSeconds != null) {
      const start = new Date(j.currentRunStartIso).getTime();
      const eta = new Date(start + Number(j.avgDurationSeconds) * 1000);
      if (!isNaN(eta.getTime())) etaHtml = '<div><b>⏳ ETA משוער:</b> ' + pad(eta.getHours()) + ':' + pad(eta.getMinutes()) + ':' + pad(eta.getSeconds()) + '</div>';
    }

    return '<div class="' + css + '">' +
      '<div class="job-head"><div class="job-name">' + escapeHtml(j.jobName) + '</div><span class="' + badgeClass + '">' + escapeHtml(badgeText) + '</span></div>' +
      '<div class="details">' +
        '<div><b>ריצה אחרונה:</b> ' + escapeHtml(j.lastRunTime || 'לא רץ מעולם') + '</div>' +
        '<div><b>משך:</b> ' + escapeHtml(j.duration || '—') + '</div>' +
        '<div><b>ריצות היום:</b> ' + escapeHtml(String(j.runsToday || 0)) + '</div>' +
        etaHtml +
        historyHtml(j.history5) +
      '</div>' +
      failureHtml +
    '</div>';
  }

  function historyHtml(history) {
    if (!history) return '';
    const dots = history.split(',').reverse().map(x => '<span class="h ' + escapeAttr(x) + '" title="' + escapeAttr(historyText(x)) + '"></span>').join('');
    return '<div><b>5 ריצות אחרונות:</b><div class="history">' + dots + '</div></div>';
  }

  function historyText(x) { return ({S:'הצלחה',F:'כשל',R:'Retry',C:'בוטל',U:'לא ידוע'})[x] || 'לא ידוע'; }
  function statusText(s) { return ({Succeeded:'הצליח',Failed:'נכשל',Running:'רץ עכשיו',Retry:'Retry',Canceled:'בוטל',Unknown:'לא ידוע'})[s] || 'לא ידוע'; }
  function pad(n) { return String(n).padStart(2,'0'); }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
  function escapeAttr(value) { return escapeHtml(value); }

  function configureAutoRefresh() {
    clearTimeout(refreshTimer);
    clearInterval(countdownTimer);
    refreshTimer = null;
    countdownTimer = null;
    nextRefreshAt = null;
    document.getElementById('countdown').textContent = '';
    scheduleNextRefresh();
  }

  function scheduleNextRefresh() {
    clearTimeout(refreshTimer);
    clearInterval(countdownTimer);
    if (!document.getElementById('autoRefresh').checked) return;

    const seconds = Number(document.getElementById('refreshSeconds').value || 60);
    nextRefreshAt = Date.now() + seconds * 1000;
    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 1000);
    refreshTimer = setTimeout(() => {
      if (!document.hidden) refreshJobs(false);
      else scheduleNextRefresh();
    }, seconds * 1000);
  }

  function updateCountdown() {
    if (!nextRefreshAt || !document.getElementById('autoRefresh').checked) {
      document.getElementById('countdown').textContent = '';
      return;
    }
    const left = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
    document.getElementById('countdown').textContent = '· בעוד ' + left + ' שנ׳';
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && document.getElementById('autoRefresh').checked) refreshJobs(false);
  });

  // כל F5 / פתיחת הדף מגיעה לכאן ולכן מפעילה שאילתה חדשה בפועל.
  refreshJobs(false);
</script>
</body>
</html>
